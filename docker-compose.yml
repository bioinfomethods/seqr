services:
  postgres:
    image: postgres:12.6
    command: postgres -c listen_addresses='*'
    ports:
      - 5432:5432
    environment:
      - PGPORT=5432
      - POSTGRES_PASSWORD=docker-compose-postgres-password
    volumes:
      - ./data/postgres_init/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -h postgres -U postgres
      interval: 5s
      timeout: 10s
      retries: 100


  keycloak-db-init:
    image: postgres:12.6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGPASSWORD=docker-compose-postgres-password
    # Keycloak gets its own DATABASE inside the shared postgres server, rather than a
    # schema inside seqrdb. The isolation costs nothing (no extra container or volume)
    # and keeps `pg_dump seqrdb` free of Keycloak's ~100 tables, so either side can be
    # dropped and rebuilt without disturbing the other.
    #
    # This exists as a one-shot service instead of living only in
    # data/postgres_init/initdb.sql because the postgres image runs initdb.sql ONLY when
    # it initialises an empty data directory. A developer with a ./data/postgres from
    # before Keycloak was added would never execute it, and Keycloak would then fail to
    # start against a database that does not exist. Creating it here is idempotent and
    # works on both existing and fresh volumes.
    command: >
      sh -c "psql -h postgres -U postgres -tc \"SELECT 1 FROM pg_database WHERE datname='keycloak'\" | grep -q 1
      || psql -h postgres -U postgres -c 'CREATE DATABASE keycloak'"
    restart: "no"

  keycloak:
    image: keycloak/keycloak:26.0
    # start-dev: HTTP without a certificate and a relaxed hostname policy, which is what
    # makes a zero-configuration local stack possible. Never use it for anything else.
    # --import-realm loads data/keycloak/realm-seqr.json on an empty database; see the
    # README there for why that file is shaped the way it is.
    command: start-dev --import-realm
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USER:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=docker-compose-postgres-password
      - KC_HEALTH_ENABLED=true
      # The browser and the seqr container cannot reach Keycloak at the same address:
      # the browser needs the published port on localhost, seqr needs the compose service
      # name. KC_HOSTNAME fixes the address Keycloak puts in browser-facing URLs and the
      # token issuer; BACKCHANNEL_DYNAMIC lets server-to-server callers keep using
      # whatever host they connected on, so http://keycloak:8080 keeps working for the
      # token exchange. See SOCIAL_AUTH_INTERNAL_API_URL in settings.py.
      - KC_HOSTNAME=${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
    volumes:
      - ./data/keycloak:/opt/keycloak/data/import:ro
    ports:
      - 8080:8080
    # The Keycloak image ships neither curl nor wget, so the health endpoint is polled
    # with bash's /dev/tcp. /health/ready is on the separate management port 9000, which
    # is deliberately not published.
    healthcheck:
      test:
        - CMD-SHELL
        - >
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 10s
      retries: 100
      start_period: 20s

  redis:
    image: redis:6.2.7
    healthcheck:
      test: redis-cli ping
      interval: 3s
      timeout: 5s
      retries: 100
    ports:
      - 6379:6379

  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    ports:
      - 8123:8123
      - 9001:9000
    volumes:
      # Main MergeTree store: entries, gt_stats, clinvar reference data, dictionaries,
      # materialized views AND the django_migrations bookkeeping. Without this the whole
      # lot lives in the container layer and is destroyed with the container, so every
      # recreate needs a full re-migrate and re-load.
      # A named volume rather than a bind mount: nothing on the host reads this (unlike
      # the user_files mounts below), and on Docker Desktop for macOS a bind mount would
      # put ClickHouse's many-small-file IO through the VM filesystem bridge. Swap for
      # `./data/clickhouse:/var/lib/clickhouse` if you need to inspect it from the host.
      - clickhouse-data:/var/lib/clickhouse
      # These two stay bind mounts: the loading pipeline and scripts/import_clickhouse_data.sh
      # write into them from the host.
      - ./data/clickhouse-seqr-data:/var/lib/clickhouse/user_files/seqr-data
      - ./data/runs:/var/lib/clickhouse/user_files/seqr-data/pipeline-data/GRCh38/SNV_INDEL/runs
      # Backing store for the annotations_memory / *_memory EmbeddedRocksDB tables
      # (CLICKHOUSE_IN_MEMORY_DIR). Search reads ONLY these tables, so without a volume
      # they live in the container layer and are silently wiped on `docker compose up
      # --force-recreate` -- leaving searches returning zero rows with no error.
      # Upstream runs this on tmpfs for speed; a named volume trades that for
      # persistence, which is the better default for local dev. To use tmpfs instead,
      # drop this line and add the `tmpfs:` block below.
      - clickhouse-in-memory:/var/lib/clickhouse/user_files/in-memory
      - ./data/clickhouse_config/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./data/clickhouse_config/logging.xml:/etc/clickhouse-server/config.d/logging.xml
      - ./data/clickhouse_config/users.xml:/etc/clickhouse-server/users.d/users.xml
      - ./data/clickhouse_config/named_collections.xml:/etc/clickhouse-server/config.d/named_collections.xml
      - ./data/clickhouse_config/init-permissions.sql:/docker-entrypoint-initdb.d/init-permissions.sql
    environment:
      - CLICKHOUSE_DB=seqr
      - CLICKHOUSE_USER=seqr_user
      - CLICKHOUSE_PASSWORD=docker-compose-clickhouse-password
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_SKIP_USER_SETUP=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 10s
      retries: 100


  seqr:
    build:
      context: .
      dockerfile: deploy/docker/seqr/Dockerfile
    image: seqr-local
    volumes:
    - .:/seqr
    # `.:/seqr` replaces the whole /seqr directory, which HIDES files the image builds
    # into it. gunicorn_config.py is copied in by the Dockerfile from
    # deploy/docker/seqr/config/, so re-mount it on top or start_server.sh dies with
    # "Error: 'gunicorn_config.py' doesn't exist". (Not an issue on ECS: no bind mount.)
    - ./deploy/docker/seqr/config/gunicorn_config.py:/seqr/gunicorn_config.py
    - ./data/readviz:/readviz
    - ./data/seqr_static_files:/seqr_static_files
    ports:
      - 8000:8000
    environment:
      - SEQR_GIT_BRANCH=dev
      - PYTHONPATH=/seqr
      - STATIC_MEDIA_DIR=/seqr_static_files
      - POSTGRES_SERVICE_HOSTNAME=postgres
      - POSTGRES_SERVICE_PORT=5432
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=docker-compose-postgres-password
      - REDIS_SERVICE_HOSTNAME=redis
      - KIBANA_SERVICE_HOSTNAME=kibana
      - CLICKHOUSE_SERVICE_HOSTNAME=clickhouse
      - CLICKHOUSE_SERVICE_PORT=9000
      - CLICKHOUSE_WRITER_USER=seqr_user
      - CLICKHOUSE_WRITER_PASSWORD=docker-compose-clickhouse-password
      - CLICKHOUSE_READER_USER=seqr_user
      - CLICKHOUSE_READER_PASSWORD=docker-compose-clickhouse-password
      - CLICKHOUSE_DATA_DIR=/var/lib/clickhouse/user_files/seqr-data
      - CLICKHOUSE_IN_MEMORY_DIR=/var/lib/clickhouse/user_files/in-memory
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - GUNICORN_WORKER_THREADS=4
      - SOCIAL_AUTH_GOOGLE_OAUTH2_CLIENT_ID=${SOCIAL_AUTH_GOOGLE_OAUTH2_CLIENT_ID}
      - SOCIAL_AUTH_PROVIDER=${SOCIAL_AUTH_PROVIDER:-keycloak}
      # Defaults point at the local keycloak service, so a clean checkout has working
      # logins with no configuration. Copy .env.example to .env and fill in the MCRI
      # values to point at the hosted realm instead.
      #
      # These two URLs address the SAME Keycloak and must both be set. The browser is
      # redirected to SOCIAL_AUTH_API_URL, so it has to be an address the host's browser
      # can open (the published port on localhost). The token exchange is a server-side
      # call made by this container, which cannot reach that address -- its own localhost
      # is not Keycloak -- so it uses SOCIAL_AUTH_INTERNAL_API_URL, the compose service
      # name. Splitting them is what removes the need for a /etc/hosts entry on every
      # developer's machine.
      - SOCIAL_AUTH_API_URL=${SOCIAL_AUTH_API_URL:-http://localhost:8080/realms/seqr}
      - SOCIAL_AUTH_INTERNAL_API_URL=${SOCIAL_AUTH_INTERNAL_API_URL:-http://keycloak:8080/realms/seqr}
      - SOCIAL_AUTH_CLIENT_ID=${SOCIAL_AUTH_CLIENT_ID:-seqr-local}
      - SOCIAL_AUTH_CLIENT_SECRET=${SOCIAL_AUTH_CLIENT_SECRET:-seqr-local-dev-secret}
      # Deliberately empty by default. This is the realm's RSA signing key, and the local
      # realm generates a fresh one each time it is imported, so no static value can be
      # right. entrypoint.sh fetches it from the realm when this is unset; a hosted realm
      # with a stable key can set it here and skip that.
      - SOCIAL_AUTH_KEYCLOAK_PUBLIC_KEY=${SOCIAL_AUTH_KEYCLOAK_PUBLIC_KEY:-}
      # Keycloak rejects an authorization request outright if any requested scope is not
      # a client scope assigned to the client -- it does not ignore unknown ones. seqr's
      # built-in default asks for ad_groups and groups, which exist in the MCRI realm;
      # the local realm emits the groups claim from a dedicated client mapper instead, so
      # only the standard scopes are requested here.
      - OIDC_SCOPE=${OIDC_SCOPE:-openid profile email}
      - ANALYST_USER_GROUP=${ANALYST_USER_GROUP:-analysts}
      - ANALYST_PROJECT_CATEGORY=${ANALYST_PROJECT_CATEGORY:-analyst-projects}
      - PM_USER_GROUP=${PM_USER_GROUP:-project-managers}
      - ENABLE_TEST_LOGIN=${ENABLE_TEST_LOGIN:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      # Not merely ordering: entrypoint.sh fetches the realm signing key from Keycloak
      # before Django starts, so Keycloak has to be serving before seqr boots.
      keycloak:
        condition: service_healthy
    healthcheck:
      test: bash -c "curl -s 'http://localhost:8000' | grep html"


  pipeline-runner:
    image: seqr-loading
    command: uv run python -m v03_pipeline.api
    volumes:
      - ./data/seqr-reference-data:/var/seqr/seqr-reference-data
      - ./data/vep_data:/var/seqr/vep-reference-data
      - ./data/input_vcfs:/input_vcfs
      - .config:/root/.config
    ports:
      - 6000:6000
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  # ClickHouse's main data directory (/var/lib/clickhouse).
  clickhouse-data:
  # Backing store for the *_memory EmbeddedRocksDB annotations tables.
  # Upstream (Clickhouse_Design_Notes.md) mounts this as tmpfs and lowers
  # max_server_memory_usage_to_ram_ratio to leave RAM for it. For local dev we prefer
  # persistence over speed. tmpfs alternative, on the clickhouse service:
  #   tmpfs:
  #     - /var/lib/clickhouse/user_files/in-memory:size=4g,uid=101,gid=101
  clickhouse-in-memory:
