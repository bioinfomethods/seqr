networks:
  clickhouse-net:
    enable_ipv6: true
    ipam:
      config:
        - subnet: "fd00:dead:beef::/48"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    container_name: clickhouse-server
    restart: unless-stopped
    networks:
      - clickhouse-net
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=seqr
      - CLICKHOUSE_USER=seqr_user
      - CLICKHOUSE_PASSWORD=docker-compose-clickhouse-password
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_SKIP_USER_SETUP=1
      - PGSSLMODE=require
    volumes:
      - /var/lib/clickhouse:/var/lib/clickhouse
      - /var/lib/clickhouse/user_files/seqr-data/in-memory:/var/lib/clickhouse/user_files/seqr-data/in-memory
      - ./config/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./config/users.xml:/etc/clickhouse-server/users.d/users.xml
      - ./config/named_collections.xml:/etc/clickhouse-server/config.d/named_collections.xml
      - ./config/init-permissions.sql:/docker-entrypoint-initdb.d/init-permissions.sql
      # libpq inside ClickHouse runs as root and tries to load /root/.postgresql/postgresql.crt
      # for client certificate auth. Mount an empty directory to prevent "Permission denied" errors
      # and let PGSSLMODE=require handle SSL without client certificates.
      - ./config/empty-pgcerts:/root/.postgresql
